name: Verify catalogue

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generated HTML, README and covers match games.json
        run: npm run check

      - name: Curated seed regenerates the same catalogue
        run: |
          cp games.json /tmp/games.json
          npm run seed
          diff -u /tmp/games.json games.json
