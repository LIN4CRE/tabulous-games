<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <radialGradient id="cheeseGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="60%" stop-color="#1a0c02"/>
      <stop offset="100%" stop-color="#080300"/>
    </radialGradient>
    <linearGradient id="goldCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#cheeseGrad)"/>
  <!-- Isometric 3D Cube Graphic -->
  <g transform="translate(430, 160)">
    <!-- Top Face -->
    <polygon points="0,-60 60,-25 0,10 -60,-25" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-60,-25 0,10 0,80 -60,45" fill="#eab308" stroke="#a16207" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,10 60,-25 60,45 0,80" fill="#ca8a04" stroke="#854d0e" stroke-width="2"/>
    <!-- Cheese Holes -->
    <ellipse cx="-25" cy="20" rx="9" ry="12" fill="#a16207"/>
    <ellipse cx="25" cy="20" rx="10" ry="14" fill="#854d0e"/>
    <ellipse cx="0" cy="-25" rx="12" ry="7" fill="#eab308"/>
  </g>
  <!-- Text -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="rgba(234, 179, 8, 0.25)" stroke="#eab308" stroke-width="1"/>
    <text x="14" y="16" fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2">BO3 CUSTOM MAP</text>
    <text x="0" y="65" fill="#ffffff" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="1.5">CHEESE CUBE</text>
    <text x="0" y="100" fill="#fde047" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">UNLIMITED SURVIVAL CHALLENGE</text>
    <text x="0" y="130" fill="#fef08a" font-family="monospace" font-size="12">ASCEND THE FLOORS // BUY WEAPONS // SURVIVE</text>
  </g>
</svg>