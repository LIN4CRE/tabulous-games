<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Chrono Divide cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041310"/>
      <stop offset="58%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#041310"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <path d="M0 0H64M0 0V64" stroke="#a7f3d0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <circle cx="210" cy="196" r="70" fill="none" stroke="#34d399" stroke-opacity="0.50" stroke-width="40"/>
    <circle cx="210" cy="196" r="122" fill="none" stroke="#34d399" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="10 16"/>
    <circle cx="210" cy="196" r="174" fill="none" stroke="#34d399" stroke-opacity="0.34" stroke-width="1.5"/>
    <circle cx="210" cy="196" r="226" fill="none" stroke="#34d399" stroke-opacity="0.26" stroke-width="1.5" stroke-dasharray="10 16"/>
    <circle cx="210" cy="196" r="278" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="294" cy="112" r="8" fill="#a7f3d0" fill-opacity="0.8"/>
    <circle cx="78" cy="266" r="4.5" fill="#a7f3d0" fill-opacity="0.55"/>
  </g>

  <text x="1268" y="640" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900"
        font-size="600" fill="#34d399" fill-opacity="0.07" letter-spacing="-20">C</text>

  <rect width="1280" height="720" fill="url(#shade)"/>

  <g font-family="Segoe UI, Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-1">
    <text x="84" y="433" fill="#ffffff" fill-opacity="0.97">CHRONO DIVIDE</text>
  </g>

  <rect x="86" y="477" width="132" height="7" rx="3.5" fill="url(#rule)"/>
</svg>
