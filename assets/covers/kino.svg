<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <radialGradient id="kinoGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#1c0707"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffd000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#kinoGrad)"/>
  <!-- Theater Projector Beam -->
  <polygon points="550,40 50,220 50,330 550,260" fill="rgba(255, 107, 0, 0.08)"/>
  <polygon points="550,50 120,240 120,300 550,230" fill="rgba(255, 208, 0, 0.12)"/>
  <!-- Reel Icon -->
  <g transform="translate(420, 90)" opacity="0.6">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ff6b00" stroke-width="4"/>
    <circle cx="60" cy="60" r="14" fill="#ff6b00"/>
    <line x1="60" y1="10" x2="60" y2="110" stroke="#ff6b00" stroke-width="2"/>
    <line x1="10" y1="60" x2="110" y2="60" stroke="#ff6b00" stroke-width="2"/>
  </g>
  <!-- Text -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="145" height="24" rx="12" fill="rgba(255, 0, 0, 0.25)" stroke="#ef4444" stroke-width="1"/>
    <text x="14" y="16" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2">THEATER OF THE DAMNED</text>
    <text x="0" y="65" fill="#ffffff" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="40" font-weight="900" letter-spacing="2">KINO DER TOTEN</text>
    <text x="0" y="100" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">CALL OF DUTY: BLACK OPS ZOMBIES</text>
    <text x="0" y="130" fill="#f59e0b" font-family="monospace" font-size="12">115 METEORITE // PACK-A-PUNCH TELEPORTER</text>
  </g>
</svg>