<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Warcraft III Web cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04140f"/>
      <stop offset="58%" stop-color="#0b3b36"/>
      <stop offset="100%" stop-color="#04140f"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <path d="M0 0H64M0 0V64" stroke="#ccfbf1" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g>
    <path d="M-130 -80 L420 680" stroke="#2dd4bf" stroke-opacity="0.34" stroke-width="56" stroke-linecap="round"/>
    <path d="M-260 -80 L290 680" stroke="#2dd4bf" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M10 -80 L560 680" stroke="#ccfbf1" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="240" cy="120" r="7" fill="#ccfbf1" fill-opacity="0.7"/>
    <rect x="-50" y="512" width="250" height="2" fill="#2dd4bf" fill-opacity="0.5"/>
  </g>

  <text x="1268" y="640" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900"
        font-size="600" fill="#2dd4bf" fill-opacity="0.07" letter-spacing="-20">W</text>

  <rect width="1280" height="720" fill="url(#shade)"/>

  <g font-family="Segoe UI, Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" letter-spacing="-1">
    <text x="84" y="378" fill="#ffffff" fill-opacity="0.97">WARCRAFT III</text>
    <text x="84" y="476" fill="#ffffff" fill-opacity="0.97">WEB</text>
  </g>

  <rect x="86" y="520" width="132" height="7" rx="3.5" fill="url(#rule)"/>
</svg>
